.rc-checkbox {
  position: relative;
  display: inline-block;
  width: 16px;
  height: 16px;
  white-space: nowrap;
  line-height: 1;
  cursor: pointer;
  outline: none;
  vertical-align: middle;
  text-align: center;
}
.rc-checkbox:hover .rc-checkbox-inner, .rc-checkbox-input:focus + .rc-checkbox-inner {
  border-color: #4EB7BA;
}
.rc-checkbox-inner {
  box-sizing: border-box;
  position: relative;
  top: 0;
  left: 0;
  display: inline-block;
  width: 100%;
  height: 100%;
  border-width: 1px;
  border-style: solid;
  /* 中性色/lofter_gray02 */
  border: 1px solid #999999;
  border-radius: 4px;
  background-color: #ffffff;
  transition: border-color 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55), background-color 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
.rc-checkbox-checkMark {
  width: 12px;
  height: 9px;
  color: #FFF;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate3d(-50%, -50%, 0);
}
.rc-checkbox-input {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 2;
  cursor: pointer;
  opacity: 0;
}
.rc-checkbox-checked:hover .rc-checkbox-inner {
  border-color: #4EB7BA;
}
.rc-checkbox-checked .rc-checkbox-inner {
  /* 品牌色/lofter_brand_ highlight_color */
  border-color: #4EB7BA;
  background-color: #4EB7BA;
}
@media print {
  .rc-checkbox-checked .rc-checkbox-inner {
    box-shadow: inset 0 0 0 16px #4EB7BA;
  }
}
.rc-checkbox-disabled.rc-checkbox-checked:hover .rc-checkbox-inner {
  border-color: #ededed;
}
.rc-checkbox-disabled.rc-checkbox-checked .rc-checkbox-inner {
  background-color: #f5f5f5;
  border-color: #ededed;
}
.rc-checkbox-disabled.rc-checkbox-checked .rc-checkbox-inner .rc-checkbox-checkMark {
  color: #ccc;
}
.rc-checkbox-disabled.rc-checkbox-checked .rc-checkbox-inner:after {
  animation-name: none;
  border-color: #cccccc;
}
@media print {
  .rc-checkbox-disabled.rc-checkbox-checked .rc-checkbox-inner {
    box-shadow: inset 0 0 0 16px #f3f3f3;
  }
}
.rc-checkbox-disabled:hover .rc-checkbox-inner {
  border-color: #d9d9d9;
}
.rc-checkbox-disabled .rc-checkbox-inner {
  border-color: #d9d9d9;
  background-color: #f3f3f3;
}
.rc-checkbox-disabled .rc-checkbox-inner:after {
  animation-name: none;
  border-color: #f3f3f3;
}
.rc-checkbox-disabled .rc-checkbox-inner-input {
  cursor: default;
}
.rc-checkbox-disabled .rc-checkbox-input {

}

  position: relative;
  background-color: #ffffff;
  border: none;
  border-radius: 6px 6px;
  background-clip: padding-box;
}
.rc-dialog-close {
  cursor: pointer;
  border: 0;
  background: transparent;
  font-size: 21px;
  position: absolute;
  right: 20px;
  top: 12px;
  font-weight: 700;
  line-height: 1;
  color: #000;

  text-decoration: none;

  content: '×';

.rc-dialog-close:hover {
  opacity: 1;
  filter: alpha(opacity=100);
  text-decoration: none;
}
.rc-dialog-header {
  padding: 13px 20px 14px 20px;
  border-radius: 5px 5px 0 0;
  background: #fff;
  color: #666;
  border-bottom: 1px solid #e9e9e9;
}
.rc-dialog-body {
  padding: 20px;
}

  animation-name: rcDialogZoomIn;

}
.rc-dialog-zoom-leave.rc-dialog-zoom-leave-active {
  animation-name: rcDialogZoomOut;
  animation-play-state: running;
}

  0% {
    opacity: 0;
    transform: scale(0, 0);
  }
  100% {
    opacity: 1;
    transform: scale(1, 1);
  }
}
@keyframes rcDialogZoomOut {
  0% {
    transform: scale(1, 1);
  }
  100% {
    opacity: 0;
    transform: scale(0, 0);
  }

  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: auto;
}

  display: none;
}

  flex: 0 1 auto;
  content: '';
  display: block;
  width: 100%;
  height: 100%;
}

  z-index: 99998;

.lfc-modal.lfc-modal__center {
  text-align: center;
}

  display: inline-block;
  width: 0;
  height: 100%;
  vertical-align: middle;
  content: '';
}
.lfc-modal.lfc-modal__center .rc-dialog {
  top: 0;
  display: inline-block;
  vertical-align: middle;
}
.lfc-modal .rc-dialog-header {
  padding: 24px 0;
  margin: 0 40px;
  color: #1F1F1F;
  text-align: center;
  border-bottom: 1px solid #ededed;
}

  box-shadow: 8px 8px 48px rgba(0, 0, 0, 0.08);
  border-radius: 16px;
}

  font-size: 12px;
  height: 12px;
  opacity: 1;
  color: #666;
  right: 48px;
  top: 32px;
  outline: none;
}
.lfc-modal .rc-dialog-close svg {
  display: block;
}
.lfc-modal .rc-dialog-footer {
  text-align: center;
  border: none;

}

.lfc-modal .rc-dialog-title {
